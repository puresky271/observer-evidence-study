<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
<title>Frozen Part I no-model coverage layers</title>
<desc>Condition counts and family counts for the development, sealed, validity, and V1.5 external-validity layers.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="38" font-size="22" font-family="sans-serif">Frozen Part I coverage layers</text>
<text x="40" y="104" font-size="16">v15_external_validity</text>
<rect x="240" y="88" width="465" height="28" fill="#0072B2"/>
<text x="715" y="108" font-size="16">216 conditions / 12 families</text>
<text x="40" y="184" font-size="16">observer_development</text>
<rect x="240" y="168" width="310" height="28" fill="#0072B2"/>
<text x="560" y="188" font-size="16">144 conditions / 6 families</text>
<text x="40" y="264" font-size="16">observer_sealed</text>
<rect x="240" y="248" width="620" height="28" fill="#0072B2"/>
<text x="870" y="268" font-size="16">288 conditions / 12 families</text>
<text x="40" y="344" font-size="16">validity_corpus</text>
<rect x="240" y="328" width="155" height="28" fill="#0072B2"/>
<text x="405" y="348" font-size="16">72 conditions / 3 families</text>
<text x="40" y="420" font-size="14" font-family="sans-serif">Conditions are nested observations; family is the independent unit.</text>
</svg>
